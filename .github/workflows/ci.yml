name: CI

# Gate de calidad/seguridad del ADR-011 (Pint/Larastan/Pest) ampliado con el
# de ADR-017 capa 7 (SDLC seguro): dependencias, secretos, SAST, imagen.
# Corre en cada push a main y en cada PR. No hace deploy — eso es
# deploy.yml, manual (ADR-009).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docket
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, intl, zip, bcmath, pcntl, opcache, redis
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: composer audit
        run: composer audit

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docket/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Typecheck (Vue/TS)
        run: npm run typecheck

      - name: Build assets
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Pest
        run: vendor/bin/pest

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-git -v --exit-code 1

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (OWASP Top 10 + PHP)
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep \
            semgrep scan --config p/security-audit --config p/owasp-top-ten --config p/php --error /src

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build imagen prod (sin publicar, solo para escanear)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/app.Dockerfile
          target: prod
          push: false
          load: true
          tags: docket-app:ci-scan
      - name: Trivy (CVEs de SO + dependencias en la imagen)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity CRITICAL,HIGH --exit-code 1 \
            --ignore-unfixed docket-app:ci-scan
