name: Deploy

# Deploy MANUAL (ADR-009: no automático en cada merge). Construye las
# imágenes, las publica en ghcr.io, y por Tailscale (nodo efímero tag:ci —
# ADR-017) copia el compose del ambiente al droplet, hace pull, migra y
# levanta. Requiere, por ambiente (GitHub → Settings → Environments):
#   Secrets: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, DEPLOY_SSH_KEY
#   Variables: DROPLET_TS_HOSTNAME (ej. "docket-dev")
# Ver infra/README.md para el detalle y cómo generarlos.
#
# Los valores de contexto (${{ ... }}) se pasan siempre por `env:` y se leen
# como "$VAR" en los `run:` — nunca interpolados directo en el script, para
# no abrir la puerta a shell injection (recomendación de GitHub Actions).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente a desplegar
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: tag
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: echo "value=${ENVIRONMENT}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push imagen de la app (target prod)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/app.Dockerfile
          target: prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-app:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository }}-app:${{ inputs.environment }}-latest

      - name: Build + push imagen de Caddy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/caddy.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-caddy:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository }}-caddy:${{ inputs.environment }}-latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Conectar al tailnet (nodo efímero, tag:ci)
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Preparar llave SSH de deploy
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Copiar compose + Caddyfile del ambiente al droplet
        env:
          HOST: ${{ vars.DROPLET_TS_HOSTNAME }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          SSH="ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519"
          $SSH root@"$HOST" 'mkdir -p /opt/docket/compose /opt/docket/docker'
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 \
            "infra/compose/docker-compose.${ENVIRONMENT}.yml" \
            root@"$HOST":"/opt/docket/compose/docker-compose.${ENVIRONMENT}.yml"
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 \
            "infra/docker/Caddyfile.${ENVIRONMENT}" \
            root@"$HOST":"/opt/docket/docker/Caddyfile.${ENVIRONMENT}"

      - name: Pull + migrar + levantar
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          HOST: ${{ vars.DROPLET_TS_HOSTNAME }}
          APP_IMAGE: ghcr.io/${{ github.repository }}-app
          CADDY_IMAGE: ghcr.io/${{ github.repository }}-caddy
          TAG: ${{ needs.build-and-push.outputs.tag }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          COMPOSE_FILE="docker-compose.${ENVIRONMENT}.yml"
          ENV_FILE="../env/${ENVIRONMENT}.env"

          # < /dev/null en cada comando: bash -s lee el script entero desde su
          # propio stdin (el heredoc); sin esto, "docker compose run" hereda
          # ese mismo stdin y se lo "come" (intenta adjuntarlo al contenedor),
          # así que bash nunca llega a leer los comandos siguientes del
          # heredoc — se pierden en silencio, sin error, sin pistas.
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 root@"$HOST" bash -s <<EOF
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            cd /opt/docket/compose
            export APP_IMAGE="$APP_IMAGE"
            export CADDY_IMAGE="$CADDY_IMAGE"
            export IMAGE_TAG="$TAG"
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" pull < /dev/null
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" run --rm -T app php artisan migrate --force < /dev/null
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" run --rm -T app php artisan tenants:migrate --force < /dev/null
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d < /dev/null
          EOF
