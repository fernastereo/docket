# CuraduriAPP · stack en el droplet docket-dev — ambiente de STAGING COMPARTIDO
#
# Esto NO es para programar. Nadie edita código acá: lo corre el pipeline de
# deploy después de cada merge a `dev` (workflow_dispatch, manual — ver
# .github/workflows/). Para programar día a día, ver docker-compose.local.yml.
#
# Igual topología que prod (imagen ya construida, sin bind-mount), con dos
# diferencias reales: Postgres en contenedor (en vez de DO Managed PG) y TLS
# por Let's Encrypt DNS-01 (en vez de Origin CA de Cloudflare) — la única
# diferencia que amerita "ambiente de prueba", el resto es idéntico a prod.

name: docket-dev

x-app-image: &app-image
  image: ${APP_IMAGE:?set APP_IMAGE}:${IMAGE_TAG:-latest}

services:
  caddy:
    image: ${CADDY_IMAGE:?set CADDY_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in infra/env/dev.env}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN in infra/env/dev.env}
    volumes:
      - ../docker/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - app_public:/var/www/html/public:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    <<: *app-image
    restart: unless-stopped
    env_file: ../env/dev.env
    environment:
      APP_ROLE: fpm
    volumes:
      - app_public:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 5

  worker:
    <<: *app-image
    restart: unless-stopped
    env_file: ../env/dev.env
    environment:
      APP_ROLE: worker
      QUEUE_NAMES: default
    depends_on:
      app:
        condition: service_healthy

  sched:
    <<: *app-image
    restart: unless-stopped
    env_file: ../env/dev.env
    environment:
      APP_ROLE: scheduler
    depends_on:
      app:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-docket}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in infra/env/dev.env}
      POSTGRES_DB: ${DB_DATABASE:-docket_central}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-docket} -d ${DB_DATABASE:-docket_central}"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  # app_public: la imagen de app trae public/build horneado; al montarse un
  # volumen nombrado vacío sobre esa ruta, Docker lo inicializa con ese
  # contenido — Caddy lo sirve desde ahí sin duplicar la imagen (mismo patrón
  # que docker-compose.prod.yml).
  app_public:
  caddy_data:
  caddy_config:
  redis_data:
  db_data:
