; CuraduriAPP · ajustes de PHP para el contenedor de app.
; Los planos y escrituras pesan: subidas generosas pero acotadas (ADR-017 pone
; el tope real de negocio en la app + Caddy; esto es el límite del runtime).

memory_limit = 256M
max_execution_time = 60
max_input_time = 60

upload_max_filesize = 64M
post_max_size = 72M
max_file_uploads = 30

expose_php = Off
date.timezone = America/Bogota

; Errores: nada al cliente en runtime; el detalle va a stderr -> logs del contenedor.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

realpath_cache_size = 4096k
realpath_cache_ttl = 600
