; Pool de PHP-FPM. Tamaño pensado para el droplet de 2 GB / 1 vCPU (ADR-009);
; se sube en prod cuando el droplet crezca.

[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Estado para el healthcheck (FastCGI, no HTTP).
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Logs a stdout/stderr del contenedor.
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
